<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關主堡壘管理 - Lumos</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 引入 instant.page：當使用者滑鼠移到導覽列連結上時，自動在背景預載該頁面，點擊時實現 0 延遲秒切 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/instant.page/5.2.0/instantpage.js" type="module" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

<!-- 頂部導覽列 -->
<header class="bg-[#0f172a] text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <!-- 左側標題 -->
        <span class="text-lg font-bold tracking-wider">關主管理後台</span>

        <!-- 右側頁籤導覽列（藍線精準對齊） -->
        <nav class="flex items-center space-x-6 text-sm font-medium">
            <!-- 加上 data-no-instant 或保持預設，讓 instant.page 進行加速 -->
            <a th:href="@{/staff-scoreboard}" class="text-gray-300 hover:text-white transition py-1">小隊分數</a>

            <a th:href="@{/staff-fortress}" class="relative text-indigo-400 font-bold py-1 inline-flex flex-col items-center">
                堡壘管理
                <span class="absolute -bottom-1 w-full h-[2.5px] bg-indigo-500 rounded-full"></span>
            </a>

            <a th:href="@{/staff-item}" class="text-gray-300 hover:text-white transition py-1">道具管理</a>
            <a th:href="@{/scoreboard}" class="text-gray-300 hover:text-white transition py-1" target="_blank">公開記分板 ↗</a>
        </nav>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">

    <div class="text-center space-y-2">
        <h1 class="text-3xl font-extrabold text-slate-900">堡壘佔領與收購行情管理</h1>
        <p class="text-sm text-slate-500">
            資料與總召控制台即時連動，目前為
            <span id="currentPhaseBadge" class="text-indigo-600 font-black px-2 py-0.5 bg-indigo-50 rounded border border-indigo-200" th:text="'第 ' + ${currentPhase} + ' 階段'">第 1 階段</span>
        </p>
    </div>

    <!-- 表格區塊 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                <tr class="border-b border-slate-200 text-slate-400 font-bold bg-slate-50">
                    <th class="py-4 px-6">堡壘代號</th>
                    <th class="py-4 px-6">目前佔領小隊</th>
                    <th class="py-4 px-6">販賣商品 (售價固定)</th>
                    <th class="py-4 px-6">當前階段收購行情</th>
                    <th class="py-4 px-6">變更佔領狀態</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="fortress : ${fortresses}" th:id="'fortress-row-' + ${fortress.id}" class="hover:bg-slate-50/80 transition">
                    <td class="py-4 px-6 font-extrabold text-slate-800 text-base" th:text="'堡壘 ' + ${fortress.code}">堡壘 A</td>

                    <td class="py-4 px-6 team-cell">
                            <span th:if="${fortress.occupyingTeam != null}"
                                  class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300/60 shadow-sm"
                                  th:text="${fortress.occupyingTeam.name}">小隊</span>
                        <span th:if="${fortress.occupyingTeam == null}"
                              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-400">無人佔領</span>
                    </td>

                    <td class="py-4 px-6 sell-cell">
                            <span th:if="${fortress.sellItem != null and fortress.sellPrice != null}"
                                  class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/80"
                                  th:text="${fortress.sellItem.name} + ' ($' + ${fortress.sellPrice} + ')'">商品</span>
                        <span th:if="${fortress.sellItem == null or fortress.sellPrice == null}"
                              class="text-slate-400 text-xs italic">無販賣商品</span>
                    </td>

                    <td class="py-4 px-6 buy-prices-cell">
                        <div class="flex flex-wrap gap-2">
                            <th:block th:each="item : ${items}">
                                <th:block th:with="price=${T(com.orientation.Lumos.model.FortressBuyPrice).findPrice(buyPrices, fortress.id, item.id, currentPhase)}">
                                        <span th:if="${price != null}"
                                              class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200/80 shadow-sm">
                                            <span th:text="${item.name}">金幣</span>：$<span th:text="${price}">3</span>
                                        </span>
                                    <span th:if="${price == null}"
                                          class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-normal bg-slate-50 text-slate-400 border border-slate-100 opacity-60">
                                            <span th:text="${item.name}">閃光幣</span>：未定
                                        </span>
                                </th:block>
                            </th:block>
                        </div>
                    </td>

                    <td class="py-4 px-6">
                        <form class="occupy-form flex items-center space-x-2">
                            <input type="hidden" name="fortressId" th:value="${fortress.id}">
                            <select name="teamId" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500 font-medium">
                                <option value="-1">-- 解除佔領 --</option>
                                <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"
                                        th:selected="${fortress.occupyingTeam != null and fortress.occupyingTeam.id == t.id}">小隊</option>
                            </select>
                            <button type="submit" class="occupy-btn px-4 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-lg transition whitespace-nowrap shadow-sm">
                                更新
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script>
    document.querySelectorAll('.occupy-form').forEach(form => {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = form.querySelector('.occupy-btn');
            const formData = new FormData(form);

            fetch('/staff/update-occupy', {
                method: 'POST',
                body: formData
            }).then(res => res.text()).then(data => {
                if (data === 'success') {
                    btn.classList.remove('bg-slate-800', 'hover:bg-slate-900');
                    btn.classList.add('bg-emerald-600');
                    btn.innerText = '已更新！';
                    fetchLatestData();
                    setTimeout(() => {
                        btn.classList.remove('bg-emerald-600');
                        btn.classList.add('bg-slate-800', 'hover:bg-slate-900');
                        btn.innerText = '更新';
                    }, 1000);
                }
            });
        });
    });

    function fetchLatestData() {
        if (document.hidden) return; // 背景分頁不發送請求，省伺服器效能

        fetch('/staff-fortress/api/data')
            .then(response => response.json())
            .then(data => {
                document.getElementById('currentPhaseBadge').innerText = '第 ' + data.currentPhase + ' 階段';
                // 同步更新畫面邏輯...
            })
            .catch(err => console.error("自動同步失敗:", err));
    }

    // 輪詢時間拉長至 5 秒，確保多人同時使用時伺服器不會過載卡頓
    setInterval(fetchLatestData, 5000);
</script>

</body>
</html>
