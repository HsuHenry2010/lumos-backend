<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小隊分數管理 - 數資聯合迎新 Lumos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/instant.page/5.2.0/instantpage.js" type="module" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

<!-- 頂部導覽列與分頁 -->
<header class="bg-gray-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <span class="text-base font-bold tracking-wider">關主管理後台</span>
        <nav class="flex items-center space-x-6 text-sm">
            <a th:href="@{/staff/scoreboard}" class="text-indigo-400 font-bold border-b-2 border-indigo-400 pb-1">小隊分數</a>
            <a th:href="@{/staff/fortress}" class="text-gray-300 hover:text-white transition">堡壘管理</a>
            <a th:href="@{/staff/item}" class="text-gray-300 hover:text-white transition">道具管理</a>
            <a th:href="@{/scoreboard}" class="text-gray-400 hover:text-white transition ml-4" target="_blank">公開記分板 ↗</a>
        </nav>
    </div>
</header>

<!-- 主要內容區 -->
<main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-12 w-full">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">小隊積分管理</h1>
        <p class="text-gray-500 text-sm">分數每 3 秒自動同步更新，在此即時調整各小隊的加扣分</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-gray-50 border-b border-gray-100 text-gray-600 text-sm">
                <th class="py-4 px-6 font-semibold">小隊名稱</th>
                <th class="py-4 px-6 font-semibold">目前積分</th>
                <th class="py-4 px-6 font-semibold">加扣分操作</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
            <tr th:each="team : ${teams}">
                <td class="py-4 px-6 font-medium text-gray-900" th:text="${team.name}">小隊名稱</td>
                <!-- 加上 data-team-id 讓 JS 可以精準即時更新該格分數，不影響旁邊的輸入框 -->
                <td class="py-4 px-6 text-indigo-600 font-bold score-cell" th:data-team-id="${team.id}" th:text="${team.score} + ' 分'">0 分</td>
                <td class="py-4 px-6">
                    <!-- 加上 class="score-form" 以便 JavaScript 攔截 -->
                    <form th:action="@{/staff/update-score}" method="post" class="score-form flex items-center space-x-2">
                        <input type="hidden" name="teamId" th:value="${team.id}">
                        <input type="number" name="points" placeholder="例: 50 或 -20" class="w-32 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-600" required>
                        <button type="submit" class="score-btn px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition">送出</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-400 text-xs">
    <p>&copy; 2026 Lumos 聯合迎新活動團隊</p>
</footer>

<script>
    // 1. 攔截表單送出，改用 AJAX 請求避免 404 頁面跳轉錯誤
    document.querySelectorAll('.score-form').forEach(form => {
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // 阻止傳統跳轉
            const btn = form.querySelector('.score-btn');
            const input = form.querySelector('input[name="points"]');
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // 成功回饋視覺效果
                    const originalText = btn.innerText;
                    btn.innerText = '已送出！';
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                    btn.classList.add('bg-emerald-600');
                    input.value = ''; // 清空輸入框

                    pollScores(); // 立即重新抓取最新分數更新畫面

                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.classList.remove('bg-emerald-600');
                        btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    }, 1000);
                } else {
                    alert('更新失敗，請檢查網路連線');
                }
            } catch (error) {
                console.error('送出表單發生錯誤', error);
                alert('伺服器連線異常');
            }
        });
    });

    // 2. 背景自動抓取最新分數並更新畫面上對應的格子，不重新整理頁面
    async function pollScores() {
        try {
            const response = and = await fetch('/api/teams'); // 若你的 api 路徑不同可自行調整
            const responseData = await response.json();
            // 相容陣列或包裝物件
            const teams = Array.isArray(responseData) ? responseData : (responseData.teams || []);

            teams.forEach(team => {
                const cell = document.querySelector(`[data-team-id='${team.id}']`);
                if (cell) {
                    cell.innerText = team.score.toLocaleString() + ' 分';
                }
            });
        } catch (error) {
            console.error('即時同步分數失敗', error);
        }
    }

    // 每 3 秒自動同步一次
    setInterval(pollScores, 3000);
</script>
</body>
</html>
