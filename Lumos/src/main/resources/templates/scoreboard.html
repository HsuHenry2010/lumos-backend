<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記分板 - 數資聯合迎新 Lumos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

<div th:replace="~{fragments/common :: navbar}"></div>

<main class="max-w-4xl mx-auto px-4 py-6 pb-24 md:pb-12 w-full flex-grow">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-5 sm:p-8 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-left">
            <div>
                <h2 class="text-xl sm:text-2xl font-bold text-gray-800">即時小隊記分板</h2>
                <span class="text-xs text-gray-500 mt-1 block">每 5 秒自動更新，或點擊按鈕立即重新整理</span>
            </div>
            <button onclick="fetchScoreboard()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm active:scale-95">
                立即重新整理
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="border-b border-gray-200 text-gray-400 text-xs uppercase tracking-wider bg-gray-50/50">
                    <th class="py-3.5 px-4 sm:px-6 font-semibold">排名</th>
                    <th class="py-3.5 px-4 sm:px-6 font-semibold">小隊名稱</th>
                    <th class="py-3.5 px-4 sm:px-6 font-semibold text-right">目前積分</th>
                </tr>
                </thead>
                <tbody id="scoreboard-body" class="divide-y divide-gray-100 text-sm">
                <tr>
                    <td colspan="3" class="py-8 text-center text-gray-400">載入中...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: mobile-nav}"></div>
<div th:replace="~{fragments/common :: footer}"></div>

<script>
    async function fetchScoreboard() {
        try {
            const response = await fetch('/api/teams');
            const teams = await response.json();

            teams.sort((a, b) => b.score - a.score);

            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';

            teams.forEach((team, index) => {
                const rank = index + 1;
                let rankStyle = "text-gray-500 font-medium";
                if (rank === 1) rankStyle = "text-amber-500 font-bold text-base";
                if (rank === 2) rankStyle = "text-gray-400 font-bold";
                if (rank === 3) rankStyle = "text-amber-700 font-bold";

                const row = `
                    <tr class="hover:bg-gray-50/80 transition">
                        <td class="py-4 px-4 sm:px-6 ${rankStyle}">${rank}</td>
                        <td class="py-4 px-4 sm:px-6 font-medium text-gray-900">${team.name}</td>
                        <td class="py-4 px-4 sm:px-6 font-bold text-indigo-600 text-right">${team.score.toLocaleString()} 分</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('無法取得分數資料', error);
        }
    }

    fetchScoreboard();
    setInterval(fetchScoreboard, 5000);
</script>
</body>
</html>
