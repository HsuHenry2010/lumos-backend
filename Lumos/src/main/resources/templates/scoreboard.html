<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記分板 - 數資聯合迎新 Lumos- NEHS X HCHS X HGHS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

<!-- 質感簡約頂部導覽列 -->
<header class="bg-gray-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <!-- 左側品牌標題 -->
        <div class="flex flex-col">
            <span class="text-base sm:text-lg font-bold tracking-wider">數資聯合迎新 Lumos</span>
            <span class="text-xs text-gray-400">NEHS X HCHS X HGHS</span>
        </div>

        <!-- 右側橫向簡約文字連結 -->
        <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
            <a th:href="@{/}" class="text-gray-300 hover:text-white transition">首頁</a>
            <a th:href="@{/activities}" class="text-gray-300 hover:text-white transition">活動介紹</a>
            <a th:href="@{/map}" class="text-gray-300 hover:text-white transition">校園地圖</a>
            <a th:href="@{/seniors}" class="text-gray-300 hover:text-white transition">學長姐</a>
            <a th:href="@{/scoreboard}" class="text-white font-semibold transition border-b-2 border-indigo-400 pb-1">記分板</a>
            <a th:href="@{/games}" class="text-gray-300 hover:text-white transition">大地遊戲</a>
        </nav>
    </div>

    <!-- 手機版導覽列 -->
    <div class="md:hidden bg-gray-950 px-4 py-3 flex flex-wrap justify-center gap-x-6 gap-y-2 text-xs border-t border-gray-800">
        <a th:href="@{/}" class="text-gray-300 hover:text-white">首頁</a>
        <a th:href="@{/activities}" class="text-gray-300 hover:text-white">活動介紹</a>
        <a th:href="@{/map}" class="text-gray-300 hover:text-white">校園地圖</a>
        <a th:href="@{/seniors}" class="text-gray-300 hover:text-white">學長姐</a>
        <a th:href="@{/scoreboard}" class="text-white font-bold underline">記分板</a>
        <a th:href="@{/games}" class="text-gray-300 hover:text-white">大地遊戲</a>
    </div>
</header>

<!-- 主要內容區：記分板 -->
<main class="max-w-4xl mx-auto px-4 py-12 w-full flex-grow">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 sm:p-8 border-b border-gray-100 bg-gray-50 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">即時小隊記分板</h2>
                <span class="text-xs text-gray-500 mt-1 block">每 5 秒自動更新，或點擊右側按鈕立即重新整理</span>
            </div>
            <button onclick="fetchScoreboard()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                重新整理
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="border-b border-gray-200 text-gray-400 text-xs uppercase tracking-wider bg-gray-50/50">
                    <th class="py-4 px-6 font-semibold">排名</th>
                    <th class="py-4 px-6 font-semibold">小隊名稱</th>
                    <th class="py-4 px-6 font-semibold text-right">目前積分</th>
                </tr>
                </thead>
                <tbody id="scoreboard-body" class="divide-y divide-gray-100 text-sm">
                <tr>
                    <td colspan="3" class="py-6 text-center text-gray-400">載入中...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- 頁尾 -->
<footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-400 text-sm">
    <p>&copy; 2026 Lumos 聯合迎新活動團隊</p>
</footer>

<script>
    async function fetchScoreboard() {
        try {
            const response = await fetch('/api/teams');
            const teams = await response.json();

            teams.sort((a, b) => b.score - a.score);

            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';

            teams.forEach((team, index) => {
                const rank = index + 1;
                let rankStyle = "text-gray-500 font-medium";
                if (rank === 1) rankStyle = "text-amber-500 font-bold text-base";
                if (rank === 2) rankStyle = "text-gray-400 font-bold";
                if (rank === 3) rankStyle = "text-amber-700 font-bold";

                const row = `
                    <tr class="hover:bg-gray-50/80 transition">
                        <td class="py-4 px-6 ${rankStyle}">${rank}</td>
                        <td class="py-4 px-6 font-medium text-gray-900">${team.name}</td>
                        <td class="py-4 px-6 font-bold text-indigo-600 text-right">${team.score.toLocaleString()} 分</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('無法取得分數資料', error);
        }
    }

    fetchScoreboard();
    setInterval(fetchScoreboard, 5000);
</script>

</body>
</html>
